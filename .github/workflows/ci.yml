name: CI Healthcheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: mythos_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI backend
        working-directory: mythos_backend
        run: |
          uvicorn mythos_backend:app --host 127.0.0.1 --port 8001 &
          echo "Backend starting via uvicorn..."
          for i in {1..15}; do
            if curl -sSf http://127.0.0.1:8001/healthz > /dev/null; then
              echo "Backend healthy"; break;
            fi
            echo "Waiting for backend (attempt $i)...";
            sleep 1;
          done
          curl -sSf http://127.0.0.1:8001/healthz > /dev/null || { echo "Backend failed to start"; exit 1; }

      - name: Run Healthcheck
        working-directory: .
        env:
          MYTHOS_MCP_PROTOCOL: 2024-10-07
        run: |
          node mcp-healthcheck.js

      - name: Archive Logs
        if: always()
        run: |
          mkdir -p artifacts
          cp mcp-healthcheck.js artifacts/ || true
        shell: bash

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-assets
          path: artifacts
