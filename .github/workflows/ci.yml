name: CI Healthcheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: mythos_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI backend (uvicorn + readiness loop)
        working-directory: mythos_backend
        run: |
          nohup python -m uvicorn mythos_backend:app --host 127.0.0.1 --port 8013 &
          echo "Backend starting via uvicorn..."
          for i in {1..40}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8013/healthz || true)
            if [ "$code" = "200" ]; then echo "Backend healthy"; break; fi
            echo "Waiting for backend (attempt $i)... (status=$code)";
            sleep 0.25;
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8013/healthz || true)
          if [ "$code" != "200" ]; then echo "Backend failed to start (final status $code)"; exit 1; fi

      - name: Run Healthcheck
        working-directory: .
        env:
          MYTHOS_MCP_PROTOCOL: 2024-10-07
          MYTHOS_SHOW_JSON: 1
          MYTHOS_COLOR: 0
        run: |
          node mcp-healthcheck.js

      - name: Archive Logs & World Data
        if: always()
        run: |
          mkdir -p artifacts
          # Save healthcheck script and backend world data snapshots
          cp mcp-healthcheck.js artifacts/ || true
          cp -r world_data artifacts/world_data || true
          # Capture recent backend log if available (requires exposing logs in workflow context)
          echo "(Backend logs not captured; consider adding dockerized run if needed)" > artifacts/README.txt
        shell: bash

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-artifacts
          path: artifacts
